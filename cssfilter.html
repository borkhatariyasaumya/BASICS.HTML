<html>
<head>
    <title>CSS Opacity Example</title>
	
	<style>
	  img{
	    width:500px;
		height:500px;
		filter: grayscale(100%);
	    transition:0.5;
	  }
	  img:hover{
	   filter: grayscale(0%) brightness(120%);
	  }
	  </style>
</head>
<center>
<body>
   <h2>CSS Filter property</h2>
   <img src="car.jpg" alt="Flower">
</body>
</center>
</html>
